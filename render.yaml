# Render blueprint for the Changia backend API.
# Docs: https://render.com/docs/blueprint-spec
#
# The frontend is deployed separately on Vercel (see client/vercel.json).
# The database stays on Neon (managed Postgres) — its URL is set as a secret.
#
# Free-tier note: Render's free web services cannot mount a persistent disk,
# so uploaded images live on the container's ephemeral filesystem and reset on
# each deploy/restart. That is acceptable for a demo. To make uploads durable,
# upgrade this service to the "starter" plan and add a `disk:` block mounted at
# /opt/render/project/src/server/uploads (see deployment/production.md).

services:
  - type: web
    name: changia-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # NODE_ENV=production makes npm omit devDependencies, but the build needs
    # them (typescript + @types/*), so force them in for the build step only.
    # Runtime (npm start -> node dist) needs none of them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Pin a modern LTS so the build matches local Node.
      - key: NODE_VERSION
        value: "22"
      # Vercel frontend origin, e.g. https://changia.vercel.app — set after the
      # frontend is deployed. Drives CORS and cross-site cookie behaviour.
      - key: CLIENT_ORIGIN
        sync: false
      # Neon connection string (postgresql://...?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # Auth secrets — Render generates strong random values on first deploy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # 'clickpesa' moves real money immediately (capped until KYC is approved),
      # 'azampay' needs approved KYC first, 'mock' is the offline demo checkout.
      - key: PAYMENT_PROVIDER
        value: clickpesa
      - key: PAYMENT_SESSION_TTL_MINUTES
        value: "30"
      # ClickPesa. Values are set in the dashboard. All three are required when
      # PAYMENT_PROVIDER=clickpesa; a missing value produces a clear checkout
      # error. CLICKPESA_WEBHOOK_SECRET must match the ?key= on the webhook URL
      # registered under Settings > Developers.
      - key: CLICKPESA_CLIENT_ID
        sync: false
      - key: CLICKPESA_API_KEY
        sync: false
      - key: CLICKPESA_WEBHOOK_SECRET
        sync: false
      # Optional, only if checksums are enabled on the account.
      - key: CLICKPESA_CHECKSUM_KEY
        sync: false
      # AzamPay (Decision 009). Sandbox credentials from the developer portal;
      # set the actual values in the dashboard. Falls back to mock if any is
      # missing. Base URLs default to sandbox (see env.ts) and don't need to be
      # set here unless moving to production AzamPay.
      - key: AZAMPAY_APP_NAME
        sync: false
      - key: AZAMPAY_CLIENT_ID
        sync: false
      - key: AZAMPAY_CLIENT_SECRET
        sync: false
      - key: AZAMPAY_API_KEY
        sync: false
      # Must match the ?key= query param on the callback URL registered in the
      # AzamPay portal (https://changia-api.onrender.com/api/payments/callback?key=...).
      - key: AZAMPAY_CALLBACK_SECRET
        sync: false
      # Blockchain — Sepolia testnet. These three values are required before a
      # live ClickPesa donation can start, ensuring each confirmed collection is
      # immediately submitted as a proof. Set them after contract deployment.
      - key: BLOCKCHAIN_NETWORK
        value: sepolia
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: BACKEND_WALLET_PRIVATE_KEY
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      # Email — 'console' logs verification/receipt mail instead of sending.
      # Switch to 'smtp' and add SMTP_* secrets to send real mail.
      - key: EMAIL_PROVIDER
        value: console
      - key: DISBURSEMENT_PROVIDER
        value: mock
