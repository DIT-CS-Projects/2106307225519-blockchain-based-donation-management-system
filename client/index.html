<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Changia: transparent, blockchain-verified NGO donations for Tanzania."
    />
    <title>Changia · Transparent NGO Donations</title>
    <script>
      // Apply the saved theme before first paint to prevent a dark-mode flash.
      // Kept inline and dependency-free; the app-side source of truth is ThemeProvider.
      ;(function () {
        try {
          var theme = localStorage.getItem('changia_theme')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (_) {
          /* storage blocked — default to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
